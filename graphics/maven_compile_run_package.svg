<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Maven compile, run und package</title>
  <desc id="desc">Prozessgrafik: Quellcode wird mit mvn compile zu target/classes kompiliert, mit java gestartet oder mit mvn package zu target/artifactId-version.jar paketiert.</desc>
  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #555; }
      .section { font: 700 28px Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font: 700 25px Arial, Helvetica, sans-serif; fill: #111; }
      .text { font: 700 20px Arial, Helvetica, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #333; }
      .mono { font: 700 24px 'Courier New', Courier, monospace; fill: #111; }
      .mono-small { font: 700 20px 'Courier New', Courier, monospace; fill: #111; }

      .green { fill: #4d8f3a; }
      .blue { fill: #2b65b3; }
      .orange { fill: #c67f17; }
      .grey { fill: #555; }

      .page { fill: #ffffff; }
      .panel { fill: #fbfcfd; stroke: #b9bcc3; stroke-width: 2.2; }
      .source-box { fill: #e6efdf; stroke: #6ca05f; stroke-width: 2.4; }
      .maven-box { fill: #e8eef9; stroke: #2b65b3; stroke-width: 2.4; }
      .run-box { fill: #f8f1e1; stroke: #d89b37; stroke-width: 2.4; }
      .artifact-box { fill: #f3f5f7; stroke: #6b7078; stroke-width: 2.4; }
      .jar-box { fill: #fff7e8; stroke: #c67f17; stroke-width: 2.6; }
      .note-box { fill: #ffffff; stroke: #b9bcc3; stroke-width: 2; }
      .tag-artifact { fill: #fff7e8; stroke: #c67f17; stroke-width: 1.8; }
      .tag-output { fill: #eef2f7; stroke: #6b7078; stroke-width: 1.8; }

      .flow { stroke: #2b65b3; stroke-width: 3.4; fill: none; }
      .run-flow { stroke: #c67f17; stroke-width: 3.4; fill: none; stroke-dasharray: 10 8; }
      .brace { stroke: #2b65b3; stroke-width: 3.2; fill: none; stroke-dasharray: 12 8; }
    </style>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b65b3"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c67f17"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1200" class="page"/>
  <text x="900" y="62" text-anchor="middle" class="title">compile != run != package</text>
  <text x="900" y="94" text-anchor="middle" class="subtitle">Maven orchestriert Build-Schritte. Java startet das kompilierte Programm.</text>

  <rect x="70" y="125" rx="22" ry="22" width="1660" height="760" class="panel"/>
  <text x="900" y="170" text-anchor="middle" class="section">Build-Ablauf mit sichtbaren Artefakten</text>

  <rect x="585" y="205" rx="18" ry="18" width="430" height="110" class="source-box"/>
  <text x="800" y="244" text-anchor="middle" class="heading green">Quellcode</text>
  <text x="800" y="278" text-anchor="middle" class="mono-small">src/main/java</text>
  <text x="800" y="302" text-anchor="middle" class="small">eigene .java-Dateien</text>

  <line x1="800" y1="315" x2="800" y2="365" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="585" y="365" rx="18" ry="18" width="430" height="112" class="maven-box"/>
  <text x="800" y="404" text-anchor="middle" class="heading blue">mvn compile</text>
  <text x="800" y="438" text-anchor="middle" class="small">Maven führt den Kompilierschritt aus</text>
  <text x="800" y="462" text-anchor="middle" class="mono-small">compile != run</text>

  <line x1="800" y1="477" x2="800" y2="527" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="585" y="527" rx="18" ry="18" width="430" height="122" class="artifact-box"/>
  <text x="800" y="568" text-anchor="middle" class="heading grey">target/classes</text>
  <text x="800" y="602" text-anchor="middle" class="small">erzeugte .class-Dateien</text>
  <rect x="665" y="615" rx="8" ry="8" width="270" height="28" class="tag-output"/>
  <text x="800" y="635" text-anchor="middle" class="small">Build-Ergebnis, kein Quellcode</text>

  <line x1="800" y1="649" x2="800" y2="699" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="585" y="699" rx="18" ry="18" width="430" height="112" class="maven-box"/>
  <text x="800" y="738" text-anchor="middle" class="heading blue">mvn package</text>
  <text x="800" y="772" text-anchor="middle" class="small">Maven paketiert die Build-Ergebnisse</text>
  <text x="800" y="796" text-anchor="middle" class="mono-small">package != Java package</text>

  <line x1="800" y1="811" x2="800" y2="853" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="585" y="853" rx="18" ry="18" width="430" height="104" class="jar-box"/>
  <text x="800" y="892" text-anchor="middle" class="heading orange">target/&lt;artifactId&gt;-&lt;version&gt;.jar</text>
  <text x="800" y="925" text-anchor="middle" class="small">einfache JAR-Datei</text>
  <rect x="680" y="936" rx="8" ry="8" width="240" height="28" class="tag-artifact"/>
  <text x="800" y="956" text-anchor="middle" class="small">Build-Artefakt</text>

  <path d="M 1015 588 C 1110 588 1110 450 1190 450" class="run-flow" marker-end="url(#arrowOrange)"/>
  <rect x="1190" y="382" rx="18" ry="18" width="430" height="136" class="run-box"/>
  <text x="1405" y="422" text-anchor="middle" class="heading orange">run</text>
  <text x="1405" y="456" text-anchor="middle" class="mono-small">java -cp target/classes ...Main</text>
  <text x="1405" y="486" text-anchor="middle" class="small">startet das Programm</text>
  <text x="1405" y="510" text-anchor="middle" class="small">erzeugt kein JAR</text>

  <rect x="180" y="345" rx="18" ry="18" width="300" height="360" class="note-box"/>
  <text x="330" y="390" text-anchor="middle" class="heading blue">Maven orchestriert</text>
  <path d="M 270 425 C 240 500 240 620 270 685" class="brace"/>
  <text x="350" y="465" text-anchor="middle" class="small">ordnet Phasen</text>
  <text x="350" y="505" text-anchor="middle" class="small">nutzt Konventionen</text>
  <text x="350" y="545" text-anchor="middle" class="small">erzeugt Artefakte</text>
  <text x="350" y="605" text-anchor="middle" class="mono-small">compile</text>
  <text x="350" y="645" text-anchor="middle" class="mono-small">package</text>
  <text x="350" y="685" text-anchor="middle" class="small">Java selbst bleibt sichtbar</text>

  <rect x="70" y="990" rx="20" ry="20" width="1660" height="160" class="panel"/>
  <text x="120" y="1035" class="section">Package-Begriffe nicht verwechseln</text>

  <rect x="120" y="1060" rx="14" ry="14" width="720" height="70" class="source-box"/>
  <text x="155" y="1090" class="text green">Java package:</text>
  <text x="360" y="1090" class="mono-small">package ch.allianz...</text>
  <text x="480" y="1118" text-anchor="middle" class="small">ordnet Klassen im Code und passt zur Ordnerstruktur</text>

  <rect x="960" y="1060" rx="14" ry="14" width="650" height="70" class="maven-box"/>
  <text x="1105" y="1090" text-anchor="middle" class="text blue">Maven-Phase:</text>
  <text x="1330" y="1090" text-anchor="middle" class="mono-small">mvn package</text>
  <text x="1285" y="1118" text-anchor="middle" class="small">Build-Phase, die ein Artefakt erzeugt</text>
</svg>
