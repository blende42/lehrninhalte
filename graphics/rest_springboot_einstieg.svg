<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">REST-Schnittstellen mit Spring Boot einführen</title>
  <desc id="desc">Konzeptgrafik: curl sendet HTTP und JSON an einen REST Controller. Der Controller nutzt den bestehenden Service, der weiterhin Repository und H2-Datenbank verwendet. REST ist nur eine neue Zugriffsschicht.</desc>

  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .section { font: 700 29px Arial, Helvetica, sans-serif; fill: #111827; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .text { font: 400 21px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .text-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .mono { font: 700 22px "Courier New", Courier, monospace; fill: #17324d; }
      .mono-small { font: 700 18px "Courier New", Courier, monospace; fill: #17324d; }

      .panel-main { fill: #fbfcfb; stroke: #b9bcc3; stroke-width: 2.4; }
      .client-box { fill: #e8eef9; stroke: #4f7fcb; stroke-width: 2.6; }
      .http-box { fill: #fff8df; stroke: #d89b37; stroke-width: 2.6; }
      .controller-box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.6; }
      .service-box { fill: #ecfdf5; stroke: #059669; stroke-width: 2.6; }
      .repo-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2.6; }
      .db-box { fill: #f1f5f9; stroke: #475569; stroke-width: 2.6; }
      .note-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.2; }
      .warn-box { fill: #fff4f1; stroke: #c45d4d; stroke-width: 2.2; }
      .good-box { fill: #edf7ed; stroke: #6ca05f; stroke-width: 2.2; }
      .summary { fill: #fff8df; stroke: #d89b37; stroke-width: 2.4; }

      .client-accent { fill: #2b65b3; }
      .http-accent { fill: #a16207; }
      .controller-accent { fill: #4338ca; }
      .service-accent { fill: #047857; }
      .repo-accent { fill: #475569; }
      .warn-accent { fill: #b34835; }
      .good-accent { fill: #4d8f3a; }

      .arrow-main { stroke: #334155; stroke-width: 3.4; fill: none; marker-end: url(#arrowMain); }
      .arrow-http { stroke: #c67f17; stroke-width: 3.2; fill: none; marker-end: url(#arrowHttp); }
      .arrow-soft { stroke: #64748b; stroke-width: 2.8; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowSoft); }
    </style>

    <marker id="arrowMain" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#334155"/>
    </marker>
    <marker id="arrowHttp" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#c67f17"/>
    </marker>
    <marker id="arrowSoft" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>

  <text x="900" y="70" text-anchor="middle" class="title">REST-Schnittstellen mit Spring Boot einführen</text>
  <text x="900" y="106" text-anchor="middle" class="subtitle">REST kommt als Zugriffsschicht vor die bestehende Fachlogik.</text>

  <rect x="70" y="145" rx="22" ry="22" width="1660" height="850" class="panel-main"/>
  <text x="900" y="192" text-anchor="middle" class="section">HTTP macht bestehende Services erreichbar</text>

  <rect x="650" y="230" rx="20" ry="20" width="500" height="100" class="client-box"/>
  <text x="900" y="270" text-anchor="middle" class="heading client-accent">curl Client</text>
  <text x="900" y="303" text-anchor="middle" class="mono">localhost:8080</text>

  <rect x="650" y="400" rx="20" ry="20" width="500" height="120" class="http-box"/>
  <text x="900" y="443" text-anchor="middle" class="heading http-accent">HTTP / JSON</text>
  <text x="770" y="482" text-anchor="start" class="mono-small">GET /produkte</text>
  <text x="770" y="510" text-anchor="start" class="mono-small">POST /produkte</text>
  <text x="1055" y="495" text-anchor="middle" class="text-small">Request und Response</text>

  <rect x="650" y="565" rx="20" ry="20" width="500" height="115" class="controller-box"/>
  <text x="900" y="605" text-anchor="middle" class="heading controller-accent">REST Controller</text>
  <text x="900" y="638" text-anchor="middle" class="mono-small">@RestController</text>
  <text x="900" y="666" text-anchor="middle" class="mono-small">@GetMapping / @PostMapping</text>

  <rect x="650" y="720" rx="20" ry="20" width="500" height="75" class="service-box"/>
  <text x="900" y="750" text-anchor="middle" class="heading service-accent">LagerService</text>
  <text x="900" y="778" text-anchor="middle" class="text-small">bestehende Fachlogik</text>

  <rect x="650" y="835" rx="20" ry="20" width="500" height="75" class="repo-box"/>
  <text x="900" y="865" text-anchor="middle" class="heading repo-accent">Repository</text>
  <text x="900" y="893" text-anchor="middle" class="text-small">bestehender Datenzugriff</text>

  <rect x="650" y="950" rx="20" ry="20" width="500" height="45" class="db-box"/>
  <text x="900" y="980" text-anchor="middle" class="heading repo-accent">H2-Datenbank</text>

  <path d="M 900 330 L 900 391" class="arrow-http"/>
  <path d="M 900 520 L 900 556" class="arrow-http"/>
  <path d="M 900 680 L 900 711" class="arrow-main"/>
  <path d="M 900 795 L 900 826" class="arrow-main"/>
  <path d="M 900 910 L 900 941" class="arrow-main"/>

  <rect x="125" y="245" rx="18" ry="18" width="410" height="210" class="note-box"/>
  <text x="330" y="290" text-anchor="middle" class="heading client-accent">Client sendet Anfrage</text>
  <text x="170" y="335" text-anchor="start" class="mono-small">curl http://localhost:8080</text>
  <text x="170" y="370" text-anchor="start" class="mono-small">-H Content-Type</text>
  <text x="170" y="405" text-anchor="start" class="mono-small">-d JSON-Body</text>
  <path d="M 535 350 C 585 350, 610 285, 650 280" class="arrow-http"/>

  <rect x="125" y="540" rx="18" ry="18" width="410" height="180" class="good-box"/>
  <text x="330" y="585" text-anchor="middle" class="heading good-accent">Schichten bleiben</text>
  <text x="330" y="625" text-anchor="middle" class="text">Service bleibt fachlich</text>
  <text x="330" y="655" text-anchor="middle" class="text">Repository bleibt technisch</text>
  <text x="330" y="685" text-anchor="middle" class="text-small">REST ersetzt diese Schichten nicht</text>
  <path d="M 535 635 C 575 635, 605 745, 650 755" class="arrow-soft"/>

  <rect x="1265" y="245" rx="18" ry="18" width="410" height="190" class="warn-box"/>
  <text x="1470" y="290" text-anchor="middle" class="heading warn-accent">Nicht im Controller</text>
  <text x="1470" y="330" text-anchor="middle" class="text">keine Preisregeln</text>
  <text x="1470" y="360" text-anchor="middle" class="text">kein JDBC</text>
  <text x="1470" y="390" text-anchor="middle" class="text-small">Controller ruft Service auf</text>
  <path d="M 1265 340 C 1215 340, 1195 610, 1150 625" class="arrow-soft"/>

  <rect x="1265" y="520" rx="18" ry="18" width="410" height="190" class="note-box"/>
  <text x="1470" y="565" text-anchor="middle" class="heading http-accent">JSON-Austausch</text>
  <text x="1310" y="610" text-anchor="start" class="mono-small">{ "name": "Maus" }</text>
  <text x="1470" y="650" text-anchor="middle" class="text">Spring serialisiert</text>
  <text x="1470" y="680" text-anchor="middle" class="text-small">Java-Objekte automatisch</text>
  <path d="M 1265 615 C 1215 615, 1190 475, 1150 460" class="arrow-http"/>

  <rect x="155" y="1020" rx="18" ry="18" width="1490" height="62" class="summary"/>
  <text x="900" y="1059" text-anchor="middle" class="heading http-accent">Merksatz: REST macht bestehende Services über HTTP erreichbar.</text>
</svg>
