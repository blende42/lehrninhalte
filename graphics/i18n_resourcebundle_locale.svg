<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Mehrsprachigkeit mit Locale und ResourceBundle</title>
  <desc id="desc">Konzeptgrafik: Locale bestimmt die Sprache, ResourceBundle lädt passende messages-Dateien und erzeugt sprachabhängige Ausgabe. Texte stehen ausserhalb des Java-Codes. Technische Konfiguration und I18N bleiben getrennt.</desc>

  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .section { font: 700 29px Arial, Helvetica, sans-serif; fill: #111827; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .text { font: 400 21px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .text-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .mono { font: 700 22px "Courier New", Courier, monospace; fill: #17324d; }
      .mono-small { font: 700 18px "Courier New", Courier, monospace; fill: #17324d; }

      .panel-main { fill: #fbfcfb; stroke: #b9bcc3; stroke-width: 2.4; }
      .locale-box { fill: #e8eef9; stroke: #4f7fcb; stroke-width: 2.6; }
      .bundle-box { fill: #fff8df; stroke: #d89b37; stroke-width: 2.6; }
      .file-box { fill: #ecfdf5; stroke: #059669; stroke-width: 2.6; }
      .output-box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.6; }
      .note-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.2; }
      .warn-box { fill: #fff4f1; stroke: #c45d4d; stroke-width: 2.2; }
      .good-box { fill: #edf7ed; stroke: #6ca05f; stroke-width: 2.2; }
      .summary { fill: #fff8df; stroke: #d89b37; stroke-width: 2.4; }

      .locale-accent { fill: #2b65b3; }
      .bundle-accent { fill: #a16207; }
      .file-accent { fill: #047857; }
      .output-accent { fill: #4338ca; }
      .warn-accent { fill: #b34835; }
      .good-accent { fill: #4d8f3a; }

      .arrow-main { stroke: #334155; stroke-width: 3.4; fill: none; marker-end: url(#arrowMain); }
      .arrow-i18n { stroke: #c67f17; stroke-width: 3.2; fill: none; marker-end: url(#arrowI18n); }
      .arrow-soft { stroke: #64748b; stroke-width: 2.8; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowSoft); }
    </style>

    <marker id="arrowMain" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#334155"/>
    </marker>
    <marker id="arrowI18n" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#c67f17"/>
    </marker>
    <marker id="arrowSoft" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>

  <text x="900" y="70" text-anchor="middle" class="title">Mehrsprachigkeit mit Locale und ResourceBundle</text>
  <text x="900" y="106" text-anchor="middle" class="subtitle">Sichtbare Texte bleiben ausserhalb des Java-Codes.</text>

  <rect x="70" y="145" rx="22" ry="22" width="1660" height="850" class="panel-main"/>
  <text x="900" y="192" text-anchor="middle" class="section">I18N lädt Texte passend zur Sprache</text>

  <!-- Main flow -->
  <rect x="650" y="235" rx="20" ry="20" width="500" height="112" class="locale-box"/>
  <text x="900" y="280" text-anchor="middle" class="heading locale-accent">Locale</text>
  <text x="900" y="315" text-anchor="middle" class="text">Sprache und optional Region</text>

  <rect x="650" y="435" rx="20" ry="20" width="500" height="112" class="bundle-box"/>
  <text x="900" y="480" text-anchor="middle" class="heading bundle-accent">ResourceBundle</text>
  <text x="900" y="515" text-anchor="middle" class="text">lädt Texte über Schlüssel</text>

  <rect x="565" y="625" rx="20" ry="20" width="670" height="170" class="file-box"/>
  <text x="900" y="670" text-anchor="middle" class="heading file-accent">messages_*.properties</text>
  <text x="650" y="715" text-anchor="start" class="mono">messages_de.properties</text>
  <text x="650" y="750" text-anchor="start" class="mono">messages_fr.properties</text>
  <text x="650" y="785" text-anchor="start" class="mono">messages_it.properties</text>
  <text x="1110" y="715" text-anchor="middle" class="text-small">Deutsch</text>
  <text x="1110" y="750" text-anchor="middle" class="text-small">Französisch</text>
  <text x="1110" y="785" text-anchor="middle" class="text-small">Italienisch</text>

  <rect x="650" y="880" rx="20" ry="20" width="500" height="105" class="output-box"/>
  <text x="900" y="923" text-anchor="middle" class="heading output-accent">sprachabhängige Ausgabe</text>
  <text x="900" y="957" text-anchor="middle" class="text">gleicher Schlüssel, anderer Text</text>

  <path d="M 900 347 L 900 426" class="arrow-main"/>
  <path d="M 900 547 L 900 616" class="arrow-main"/>
  <path d="M 900 795 L 900 871" class="arrow-main"/>

  <!-- Left side: application supports multiple languages -->
  <rect x="125" y="245" rx="18" ry="18" width="410" height="230" class="note-box"/>
  <text x="330" y="290" text-anchor="middle" class="heading locale-accent">Gleiche Anwendung</text>
  <text x="330" y="327" text-anchor="middle" class="text">mehrere Sprachen</text>
  <text x="170" y="370" text-anchor="start" class="mono-small">de: Lagerverwaltung</text>
  <text x="170" y="402" text-anchor="start" class="mono-small">fr: Gestion du stock</text>
  <text x="170" y="434" text-anchor="start" class="mono-small">it: Gestione magazzino</text>
  <path d="M 535 355 C 580 355, 610 325, 650 292" class="arrow-i18n"/>

  <rect x="125" y="545" rx="18" ry="18" width="410" height="160" class="good-box"/>
  <text x="330" y="590" text-anchor="middle" class="heading good-accent">Keine harten Texte</text>
  <text x="330" y="627" text-anchor="middle" class="text">Schlüssel im Java-Code</text>
  <text x="330" y="657" text-anchor="middle" class="text">Texte in Sprachdateien</text>
  <text x="330" y="687" text-anchor="middle" class="text-small">Änderung ohne Codeänderung</text>
  <path d="M 535 625 C 575 625, 610 540, 650 495" class="arrow-soft"/>

  <!-- Right side: separation and Switzerland context -->
  <rect x="1265" y="245" rx="18" ry="18" width="410" height="180" class="warn-box"/>
  <text x="1470" y="290" text-anchor="middle" class="heading warn-accent">Konfiguration ≠ I18N</text>
  <text x="1470" y="327" text-anchor="middle" class="text">app.properties: Technik</text>
  <text x="1470" y="357" text-anchor="middle" class="text">messages_*: Texte</text>
  <text x="1470" y="390" text-anchor="middle" class="text-small">gleicher Dateityp, andere Aufgabe</text>
  <path d="M 1265 335 C 1215 335, 1195 455, 1150 480" class="arrow-soft"/>

  <rect x="1265" y="495" rx="18" ry="18" width="410" height="170" class="note-box"/>
  <text x="1470" y="540" text-anchor="middle" class="heading locale-accent">Sprache wechseln</text>
  <text x="1310" y="585" text-anchor="start" class="mono-small">Locale.GERMAN</text>
  <text x="1310" y="620" text-anchor="start" class="mono-small">Locale.FRENCH</text>
  <text x="1310" y="655" text-anchor="start" class="mono-small">Locale.ITALIAN</text>
  <path d="M 1265 585 C 1215 580, 1195 530, 1150 500" class="arrow-i18n"/>

  <rect x="1265" y="740" rx="18" ry="18" width="410" height="145" class="note-box"/>
  <text x="1470" y="785" text-anchor="middle" class="heading output-accent">Schweiz</text>
  <text x="1470" y="823" text-anchor="middle" class="text">mehrsprachiger Kontext</text>
  <text x="1470" y="852" text-anchor="middle" class="text-small">Deutsch, Französisch, Italienisch</text>
  <path d="M 1265 810 C 1210 805, 1180 925, 1150 930" class="arrow-i18n"/>

  <!-- Summary -->
  <rect x="155" y="1020" rx="18" ry="18" width="1490" height="62" class="summary"/>
  <text x="900" y="1059" text-anchor="middle" class="heading bundle-accent">Merksatz: Java-Code bleibt gleich, sichtbare Texte wechseln nach Locale.</text>
</svg>
