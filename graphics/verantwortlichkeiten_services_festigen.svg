<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Verantwortlichkeiten und Services festigen</title>
  <desc id="desc">Vergleichsgrafik: Links ist alles in Main vermischt. Rechts sind Ablaufsteuerung, Fachlogik, Persistenzvertrag, CSV-Umsetzung und Daten bewusst getrennt.</desc>

  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111; }
      .section { font: 700 30px Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font: 700 26px Arial, Helvetica, sans-serif; fill: #111; }
      .text { font: 700 22px Arial, Helvetica, sans-serif; fill: #111; }
      .text-regular { font: 400 22px Arial, Helvetica, sans-serif; fill: #222; }
      .text-tight { font: 700 20px Arial, Helvetica, sans-serif; fill: #111; }
      .text-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #222; }
      .mono { font: 700 24px "Courier New", Courier, monospace; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #555; }

      .bad-accent { fill: #b34835; }
      .good-accent { fill: #2b65b3; }
      .service-accent { fill: #4d8f3a; }
      .store-accent { fill: #8a5fb8; }
      .data-accent { fill: #c67f17; }
      .muted { fill: #666; }

      .panel { fill: #fbfcfb; stroke-width: 2.2; }
      .panel-left { stroke: #d98a7b; }
      .panel-right { stroke: #6f9ce0; }

      .header-left { fill: #f6ded9; stroke: #d98a7b; stroke-width: 2; }
      .header-right { fill: #dfe8f7; stroke: #6f9ce0; stroke-width: 2; }

      .bad-box { fill: #fff4f1; stroke: #c45d4d; stroke-width: 2.4; }
      .flow-box { fill: #e8eef9; stroke: #6f9ce0; stroke-width: 2.3; }
      .service-box { fill: #e6efdf; stroke: #6ca05f; stroke-width: 2.3; }
      .store-box { fill: #f1e8fa; stroke: #9a78c7; stroke-width: 2.3; }
      .data-box { fill: #fff5df; stroke: #d89b37; stroke-width: 2.3; }
      .summary { fill: #f7f8fa; stroke: #b9bcc3; stroke-width: 2; }

      .guide { fill: none; stroke: #c9cdd4; stroke-width: 1.5; stroke-dasharray: 8 8; }
      .arrow-bad { stroke: #c45d4d; stroke-width: 3.2; fill: none; marker-end: url(#arrowBad); }
      .arrow-good { stroke: #2b65b3; stroke-width: 3.2; fill: none; marker-end: url(#arrowGood); }
      .arrow-service { stroke: #6ca05f; stroke-width: 3.2; fill: none; marker-end: url(#arrowService); }
      .arrow-store { stroke: #9a78c7; stroke-width: 3.2; fill: none; marker-end: url(#arrowStore); }
      .arrow-data { stroke: #d89b37; stroke-width: 3.2; fill: none; marker-end: url(#arrowData); }
      .arrow-soft { stroke: #7aa6d8; stroke-width: 2.6; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowSoft); }
    </style>

    <marker id="arrowBad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c45d4d"/>
    </marker>
    <marker id="arrowGood" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b65b3"/>
    </marker>
    <marker id="arrowService" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ca05f"/>
    </marker>
    <marker id="arrowStore" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a78c7"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d89b37"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa6d8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>

  <text x="900" y="72" text-anchor="middle" class="title">Verantwortlichkeiten und Services festigen</text>
  <text x="900" y="104" text-anchor="middle" class="small">Bewusst trennen: Ablauf, Fachlogik, Persistenzvertrag, CSV-Umsetzung und Daten</text>

  <!-- Linkes Panel: Fehlstruktur -->
  <rect x="40" y="130" rx="18" ry="18" width="710" height="710" class="panel panel-left"/>
  <rect x="58" y="146" rx="16" ry="16" width="674" height="64" class="header-left"/>
  <text x="395" y="188" text-anchor="middle" class="section">Problem: alles in Main</text>

  <rect x="150" y="238" rx="18" ry="18" width="490" height="350" class="bad-box"/>
  <text x="395" y="282" text-anchor="middle" class="heading bad-accent">Main</text>
  <text x="395" y="324" text-anchor="middle" class="mono bad-accent">main(...)</text>
  <text x="395" y="374" text-anchor="middle" class="text">Ablaufsteuerung</text>
  <text x="395" y="418" text-anchor="middle" class="text">Fachlogik</text>
  <text x="395" y="462" text-anchor="middle" class="mono bad-accent">verkaufen(...)</text>
  <text x="395" y="506" text-anchor="middle" class="mono bad-accent">bestandPruefen(...)</text>
  <text x="395" y="550" text-anchor="middle" class="text">CSV speichern/laden</text>

  <path d="M 395 660 L 395 588" class="arrow-bad"/>
  <text x="395" y="700" text-anchor="middle" class="heading bad-accent">zu viele Aufgaben</text>
  <text x="395" y="735" text-anchor="middle" class="text-tight">Main wird gross und schwer testbar</text>
  <text x="395" y="775" text-anchor="middle" class="text-tight">Fachlogik und Persistenz sind vermischt</text>

  <!-- Mittellinie -->
  <line x1="786" y1="122" x2="786" y2="844" class="guide"/>

  <!-- Rechtes Panel: bessere Struktur -->
  <rect x="826" y="130" rx="18" ry="18" width="934" height="710" class="panel panel-right"/>
  <rect x="844" y="146" rx="16" ry="16" width="898" height="64" class="header-right"/>
  <text x="1293" y="188" text-anchor="middle" class="section">Besser: getrennte Verantwortlichkeiten</text>

  <!-- Main -->
  <rect x="1055" y="238" rx="18" ry="18" width="475" height="92" class="flow-box"/>
  <text x="1292" y="275" text-anchor="middle" class="heading good-accent">Main</text>
  <text x="1292" y="306" text-anchor="middle" class="text">Ablaufsteuerung</text>

  <!-- Service -->
  <rect x="950" y="410" rx="18" ry="18" width="300" height="150" class="service-box"/>
  <text x="1100" y="448" text-anchor="middle" class="heading service-accent">LagerService</text>
  <text x="1100" y="482" text-anchor="middle" class="text">Fachlogik</text>
  <text x="1100" y="518" text-anchor="middle" class="mono service-accent">verkaufen(...)</text>
  <text x="1100" y="548" text-anchor="middle" class="mono service-accent">bestandPruefen(...)</text>

  <!-- Speicher -->
  <rect x="1355" y="410" rx="18" ry="18" width="300" height="150" class="store-box"/>
  <text x="1505" y="448" text-anchor="middle" class="heading store-accent">ProduktSpeicher</text>
  <text x="1505" y="480" text-anchor="middle" class="text-tight">Vertrag</text>
  <text x="1505" y="516" text-anchor="middle" class="text-tight store-accent">CsvProduktSpeicher</text>
  <text x="1505" y="548" text-anchor="middle" class="text-small">CSV laden/speichern</text>

  <!-- Produkt -->
  <rect x="1120" y="650" rx="18" ry="18" width="345" height="86" class="data-box"/>
  <text x="1292" y="685" text-anchor="middle" class="heading data-accent">Produkt</text>
  <text x="1292" y="716" text-anchor="middle" class="text">Daten</text>

  <!-- Beziehungen rechts -->
  <path d="M 1195 330 C1150 355, 1120 380, 1105 410" class="arrow-service"/>
  <text x="1066" y="366" text-anchor="middle" class="small">nutzt Service</text>

  <path d="M 1390 330 C1440 356, 1480 382, 1495 410" class="arrow-store"/>
  <text x="1530" y="366" text-anchor="middle" class="small">ruft Speicher auf</text>

  <path d="M 1100 560 C1128 600, 1180 630, 1240 650" class="arrow-data"/>
  <text x="1020" y="638" text-anchor="middle" class="small">arbeitet mit</text>

  <path d="M 1505 560 C1480 604, 1415 632, 1355 650" class="arrow-soft"/>
  <text x="1600" y="638" text-anchor="middle" class="small">liest/schreibt</text>

  <path d="M 1292 362 L 1292 330" class="arrow-good"/>
  <text x="1292" y="386" text-anchor="middle" class="heading good-accent">Main bleibt klein</text>

  <text x="1020" y="600" text-anchor="middle" class="text-tight service-accent">Fachlogik im Service</text>
  <text x="1600" y="600" text-anchor="middle" class="text-tight store-accent">Persistenz separat</text>
  <text x="1292" y="785" text-anchor="middle" class="text-tight data-accent">Produkt entscheidet nicht über Speicherung</text>

  <!-- Zusammenfassung -->
  <rect x="60" y="888" rx="20" ry="20" width="1680" height="178" class="summary"/>
  <text x="98" y="934" class="section">Zusammenfassung</text>

  <circle cx="112" cy="978" r="6.5" fill="#c45d4d"/>
  <text x="132" y="986" class="text-tight">Fehlstruktur: Alles in Main vermischt Ablauf, Fachlogik und Persistenz.</text>

  <circle cx="112" cy="1026" r="6.5" fill="#c45d4d"/>
  <text x="132" y="1034" class="text-tight">Folge: Main wird gross, Regeln sind schwerer testbar.</text>

  <circle cx="898" cy="978" r="6.5" fill="#2b65b3"/>
  <text x="918" y="986" class="text-tight">Bessere Struktur: Jede Klasse hat eine klare Verantwortung.</text>

  <circle cx="898" cy="1026" r="6.5" fill="#2b65b3"/>
  <text x="918" y="1034" class="text-tight">Fachlogik liegt im Service, CSV-Details bleiben bei CsvProduktSpeicher.</text>

</svg>
