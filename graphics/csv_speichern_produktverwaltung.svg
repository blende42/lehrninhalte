<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Java-Objekte als CSV-Datei speichern</title>
  <desc id="desc">Prozessgrafik: Eine ArrayList mit Produktobjekten wird durchlaufen, in CSV-Zeilen umgewandelt und als Textdatei gespeichert.</desc>

  <defs>
    <style>
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #555; }
      .section { font: 700 30px Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font: 700 25px Arial, Helvetica, sans-serif; fill: #111; }
      .text { font: 700 22px Arial, Helvetica, sans-serif; fill: #111; }
      .text-tight { font: 700 20px Arial, Helvetica, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #555; }
      .mono { font: 700 24px "Courier New", Courier, monospace; fill: #111; }

      .page { fill: #ffffff; }
      .panel { fill: #fbfcfd; stroke: #b9bcc3; stroke-width: 2.2; }
      .panel-soft { fill: #f7f8fa; stroke: #b9bcc3; stroke-width: 2.2; }
      .object-box { fill: #f1eefb; stroke: #7356b6; stroke-width: 2.4; }
      .step-box { fill: #eef5ff; stroke: #2b65b3; stroke-width: 2.4; }
      .parse-box { fill: #fff7e8; stroke: #c67f17; stroke-width: 2.4; }
      .file-box { fill: #edf6ea; stroke: #4d8f3a; stroke-width: 2.6; }
      .error-box { fill: #fff1f1; stroke: #b83232; stroke-width: 2.4; }
      .note-box { fill: #ffffff; stroke: #b9bcc3; stroke-width: 2.2; }

      .blue { fill: #2b65b3; }
      .green { fill: #4d8f3a; }
      .orange { fill: #c67f17; }
      .purple { fill: #7356b6; }
      .red { fill: #b83232; }

      .flow { stroke: #6b7078; stroke-width: 3.4; fill: none; }
      .flow-blue { stroke: #2b65b3; stroke-width: 3.6; fill: none; }
      .flow-red { stroke: #b83232; stroke-width: 3.4; fill: none; stroke-dasharray: 10 8; }
    </style>

    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7078"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b65b3"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b83232"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" class="page"/>
  <text x="900" y="72" text-anchor="middle" class="title">Java-Objekte werden als CSV-Datei gespeichert</text>
  <text x="900" y="106" text-anchor="middle" class="subtitle">String-Verarbeitung verbindet Objekte im Programm mit einer Textdatei.</text>

  <rect x="70" y="145" rx="20" ry="20" width="1660" height="640" class="panel"/>
  <rect x="95" y="165" rx="16" ry="16" width="1610" height="66" class="panel-soft"/>
  <text x="900" y="208" text-anchor="middle" class="section">Von der Produktliste zur CSV-Datei</text>

  <rect x="115" y="295" rx="16" ry="16" width="265" height="126" class="object-box"/>
  <text x="247" y="338" text-anchor="middle" class="heading purple">ArrayList&lt;Produkt&gt;</text>
  <text x="247" y="372" text-anchor="middle" class="text-tight">mehrere Objekte</text>
  <text x="247" y="402" text-anchor="middle" class="text-tight">im Programm</text>

  <rect x="445" y="295" rx="16" ry="16" width="245" height="126" class="step-box"/>
  <text x="567" y="338" text-anchor="middle" class="heading blue">durchlaufen</text>
  <text x="567" y="372" text-anchor="middle" class="text-tight">jedes Produkt</text>
  <text x="567" y="402" text-anchor="middle" class="text-tight">einzeln lesen</text>

  <rect x="755" y="295" rx="16" ry="16" width="250" height="126" class="parse-box"/>
  <text x="880" y="338" text-anchor="middle" class="heading orange">CSV-Zeile</text>
  <text x="880" y="372" text-anchor="middle" class="text-tight">Name + ";"</text>
  <text x="880" y="402" text-anchor="middle" class="text-tight">+ Preis</text>

  <rect x="1070" y="295" rx="16" ry="16" width="245" height="126" class="step-box"/>
  <text x="1192" y="338" text-anchor="middle" class="heading blue">Datei schreiben</text>
  <text x="1192" y="372" text-anchor="middle" class="text-tight">Files.write(...)</text>
  <text x="1192" y="402" text-anchor="middle" class="text-tight">überschreibt</text>

  <rect x="1380" y="295" rx="16" ry="16" width="270" height="126" class="file-box"/>
  <text x="1515" y="338" text-anchor="middle" class="heading green">CSV-Datei</text>
  <text x="1515" y="372" text-anchor="middle" class="text-tight">Textformat</text>
  <text x="1515" y="402" text-anchor="middle" class="mono">Tastatur;79.9</text>

  <line x1="380" y1="358" x2="445" y2="358" class="flow" marker-end="url(#arrowGrey)"/>
  <line x1="690" y1="358" x2="755" y2="358" class="flow-blue" marker-end="url(#arrowBlue)"/>
  <line x1="1005" y1="358" x2="1070" y2="358" class="flow-blue" marker-end="url(#arrowBlue)"/>
  <line x1="1315" y1="358" x2="1380" y2="358" class="flow" marker-end="url(#arrowGrey)"/>

  <rect x="150" y="545" rx="16" ry="16" width="420" height="132" class="note-box"/>
  <text x="360" y="588" text-anchor="middle" class="heading blue">Fachlogik</text>
  <text x="360" y="624" text-anchor="middle" class="text-tight">ProduktVerwaltung</text>
  <text x="360" y="654" text-anchor="middle" class="text-tight">zählt und rechnet</text>

  <rect x="690" y="545" rx="16" ry="16" width="420" height="132" class="parse-box"/>
  <text x="900" y="588" text-anchor="middle" class="heading orange">String-Verarbeitung</text>
  <text x="900" y="624" text-anchor="middle" class="text-tight">Objekte werden</text>
  <text x="900" y="654" text-anchor="middle" class="text-tight">zu Textzeilen</text>

  <rect x="1230" y="545" rx="16" ry="16" width="420" height="132" class="note-box"/>
  <text x="1440" y="588" text-anchor="middle" class="heading green">Dateilogik</text>
  <text x="1440" y="624" text-anchor="middle" class="text-tight">CsvProduktSpeicher</text>
  <text x="1440" y="654" text-anchor="middle" class="text-tight">schreibt Datei</text>

  <path d="M 360 545 C 370 500 335 455 247 421" class="flow-blue" marker-end="url(#arrowBlue)"/>
  <path d="M 900 545 C 895 500 885 455 880 421" class="flow-blue" marker-end="url(#arrowBlue)"/>
  <path d="M 1440 545 C 1480 500 1510 455 1515 421" class="flow-blue" marker-end="url(#arrowBlue)"/>

  <rect x="120" y="835" rx="18" ry="18" width="500" height="134" class="error-box"/>
  <text x="370" y="878" text-anchor="middle" class="heading red">Einfache Fehlerfälle</text>
  <text x="370" y="914" text-anchor="middle" class="text-tight">leere Liste, Zielordner fehlt</text>
  <text x="370" y="944" text-anchor="middle" class="text-tight">ungültiger Name oder Preis</text>

  <rect x="650" y="835" rx="18" ry="18" width="500" height="134" class="note-box"/>
  <text x="900" y="878" text-anchor="middle" class="heading orange">Format muss passen</text>
  <text x="900" y="914" text-anchor="middle" class="text-tight">Speichern: Name;Preis</text>
  <text x="900" y="944" text-anchor="middle" class="text-tight">Laden: split(&quot;;&quot;)</text>

  <rect x="1180" y="835" rx="18" ry="18" width="500" height="134" class="note-box"/>
  <text x="1430" y="878" text-anchor="middle" class="heading green">Trennung hilft</text>
  <text x="1430" y="914" text-anchor="middle" class="text-tight">Datei schreiben ist nicht</text>
  <text x="1430" y="944" text-anchor="middle" class="text-tight">Gesamtwert berechnen</text>

  <path d="M 1040 835 C 1160 720 1130 560 980 421" class="flow-red" marker-end="url(#arrowRed)"/>

  <text x="900" y="1058" text-anchor="middle" class="text">Kernidee: Produktobjekte werden in sichtbare CSV-Textzeilen umgewandelt und gespeichert.</text>
</svg>
