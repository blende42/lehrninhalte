<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Mapping zwischen Objekten und Datenbank</title>
  <desc id="desc">Konzeptgrafik: DbProduktSpeicher übersetzt zwischen Produkt-Objekt, PreparedStatement, ResultSet und Tabelle PRODUKT. Fachlogik bleibt getrennt.</desc>
  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111; }
      .section { font: 700 30px Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font: 700 26px Arial, Helvetica, sans-serif; fill: #111; }
      .text { font: 700 22px Arial, Helvetica, sans-serif; fill: #111; }
      .text-regular { font: 400 22px Arial, Helvetica, sans-serif; fill: #222; }
      .text-tight { font: 700 20px Arial, Helvetica, sans-serif; fill: #111; }
      .text-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #222; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #555; }
      .mono { font: 700 23px 'Courier New', Courier, monospace; fill: #111; }

      .left-accent { fill: #4d8f3a; }
      .right-accent { fill: #2b65b3; }
      .hint-accent { fill: #c67f17; }
      .muted { fill: #666; }

      .panel { fill: #fbfcfb; stroke-width: 2.2; }
      .panel-left { stroke: #6ca05f; }
      .panel-right { stroke: #6f9ce0; }
      .panel-neutral { stroke: #b9bcc3; }
      .panel-hint { stroke: #d89b37; }

      .header-left { fill: #dfead8; stroke: #6ca05f; stroke-width: 2; }
      .header-right { fill: #dfe8f7; stroke: #6f9ce0; stroke-width: 2; }
      .header-neutral { fill: #f2f4f7; stroke: #b9bcc3; stroke-width: 2; }
      .header-hint { fill: #f8f1e1; stroke: #d89b37; stroke-width: 2; }

      .summary { fill: #f7f8fa; stroke: #b9bcc3; stroke-width: 2; }
      .flow-write { stroke: #2b65b3; stroke-width: 3.4; fill: none; }
      .flow-read { stroke: #4d8f3a; stroke-width: 3.4; fill: none; }
      .flow-hint { stroke: #c67f17; stroke-width: 3.2; fill: none; stroke-dasharray: 9 8; }
    </style>

    <marker id="arrowWrite" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b65b3"/>
    </marker>
    <marker id="arrowRead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d8f3a"/>
    </marker>
    <marker id="arrowHint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c67f17"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>
  <text x="900" y="72" text-anchor="middle" class="title">Mapping zwischen Objekten und Datenbank</text>
  <text x="900" y="104" text-anchor="middle" class="small">Objekte müssen zwischen Java und Datenbank übersetzt werden</text>

  <rect x="60" y="140" rx="20" ry="20" width="1680" height="690" class="panel panel-neutral"/>
  <rect x="80" y="158" rx="16" ry="16" width="1640" height="64" class="header-neutral"/>
  <text x="900" y="200" text-anchor="middle" class="section">DbProduktSpeicher übersetzt in beide Richtungen</text>

  <!-- Java-Seite -->
  <rect x="110" y="292" rx="18" ry="18" width="330" height="230" class="panel panel-left"/>
  <rect x="130" y="320" rx="14" ry="14" width="290" height="52" class="header-left"/>
  <text x="275" y="354" text-anchor="middle" class="heading left-accent">Produkt-Objekt</text>
  <text x="165" y="410" class="mono">id</text>
  <text x="165" y="444" class="mono">name</text>
  <text x="165" y="478" class="mono">preis</text>
  <text x="165" y="512" class="mono">bestand</text>
  <text x="305" y="410" class="text-small muted">Java</text>
  <text x="305" y="444" class="text-small muted">Attribute</text>
  <text x="305" y="478" class="text-small muted">Fachobjekt</text>
  <text x="305" y="512" class="text-small muted">Attribut</text>

  <!-- Zentrale Mapping-Klasse -->
  <rect x="655" y="260" rx="22" ry="22" width="490" height="250" class="panel panel-hint"/>
  <rect x="675" y="280" rx="16" ry="16" width="450" height="58" class="header-hint"/>
  <text x="900" y="318" text-anchor="middle" class="section hint-accent">DbProduktSpeicher</text>
  <text x="900" y="374" text-anchor="middle" class="text-tight">Mapping als Übersetzung</text>
  <text x="900" y="410" text-anchor="middle" class="text-regular">ResultSet -&gt; Objekt</text>
  <text x="900" y="446" text-anchor="middle" class="text-regular">Objekt -&gt; SQL-Werte</text>
  <text x="900" y="482" text-anchor="middle" class="text-small muted">JDBC-Code bleibt in der Persistenzklasse</text>

  <!-- Datenbank-Seite -->
  <rect x="1360" y="270" rx="18" ry="18" width="330" height="150" class="panel panel-right"/>
  <rect x="1380" y="290" rx="14" ry="14" width="290" height="50" class="header-right"/>
  <text x="1525" y="323" text-anchor="middle" class="heading right-accent">PreparedStatement</text>
  <text x="1525" y="374" text-anchor="middle" class="text-tight">SQL-Werte setzen</text>
  <text x="1525" y="404" text-anchor="middle" class="text-small muted">setString, setDouble, setInt</text>

  <rect x="1360" y="500" rx="18" ry="18" width="330" height="230" class="panel panel-right"/>
  <rect x="1380" y="520" rx="14" ry="14" width="290" height="50" class="header-right"/>
  <text x="1525" y="553" text-anchor="middle" class="heading right-accent">Tabelle PRODUKT</text>
  <text x="1425" y="608" class="mono">ID</text>
  <text x="1425" y="642" class="mono">NAME</text>
  <text x="1425" y="676" class="mono">PREIS</text>
  <text x="1425" y="710" class="mono">BESTAND</text>
  <text x="1555" y="608" class="text-small muted">Spalte</text>
  <text x="1555" y="642" class="text-small muted">Spalte</text>
  <text x="1555" y="676" class="text-small muted">Spalte</text>
  <text x="1555" y="710" class="text-small muted">Spalte</text>

  <rect x="710" y="610" rx="18" ry="18" width="380" height="140" class="panel panel-left"/>
  <rect x="730" y="630" rx="14" ry="14" width="340" height="50" class="header-left"/>
  <text x="900" y="663" text-anchor="middle" class="heading left-accent">ResultSet</text>
  <text x="900" y="712" text-anchor="middle" class="text-tight">JDBC liefert rohe Daten</text>
  <text x="900" y="742" text-anchor="middle" class="text-small muted">Zeilen und Spalten, keine Objekte</text>

  <!-- Schreibweg -->
  <path d="M 440 395 L 655 385" class="flow-write" marker-end="url(#arrowWrite)"/>
  <text x="540" y="350" text-anchor="middle" class="text-tight right-accent">Objekt -&gt; Werte</text>
  <path d="M 1145 385 L 1360 345" class="flow-write" marker-end="url(#arrowWrite)"/>
  <text x="1250" y="330" text-anchor="middle" class="text-tight right-accent">PreparedStatement</text>
  <path d="M 1525 420 L 1525 500" class="flow-write" marker-end="url(#arrowWrite)"/>
  <text x="1576" y="468" text-anchor="start" class="text-tight right-accent">INSERT / UPDATE</text>

  <!-- Leseweg -->
  <path d="M 1360 620 L 1090 685" class="flow-read" marker-end="url(#arrowRead)"/>
  <text x="1235" y="690" text-anchor="middle" class="text-tight left-accent">SELECT liefert ResultSet</text>
  <path d="M 790 610 L 900 510" class="flow-read" marker-end="url(#arrowRead)"/>
  <text x="740" y="560" text-anchor="middle" class="text-tight left-accent">ResultSet -&gt; Objekt</text>
  <path d="M 655 425 L 440 430" class="flow-read" marker-end="url(#arrowRead)"/>
  <text x="540" y="470" text-anchor="middle" class="text-tight left-accent">neues Produkt</text>

  <!-- Fachlogik getrennt -->
  <rect x="110" y="610" rx="18" ry="18" width="330" height="140" class="panel panel-neutral"/>
  <rect x="130" y="630" rx="14" ry="14" width="290" height="50" class="header-neutral"/>
  <text x="275" y="663" text-anchor="middle" class="heading">LagerService</text>
  <text x="275" y="712" text-anchor="middle" class="text-tight">Fachlogik bleibt getrennt</text>
  <text x="275" y="742" text-anchor="middle" class="text-small muted">kein SQL, kein Mapping</text>
  <path d="M 275 610 L 275 522" class="flow-hint" marker-end="url(#arrowHint)"/>
  <text x="305" y="560" text-anchor="start" class="text-tight hint-accent">arbeitet mit Produkten</text>

  <!-- Merksatz -->
  <rect x="220" y="790" rx="18" ry="18" width="1360" height="70" class="panel panel-hint"/>
  <text x="900" y="834" text-anchor="middle" class="heading hint-accent">Mapping ist die Übersetzung zwischen Fachobjekt und Datenbankstruktur.</text>

  <!-- Zusammenfassung -->
  <rect x="60" y="900" rx="20" ry="20" width="1680" height="160" class="summary"/>
  <text x="98" y="946" class="section">Zusammenfassung</text>
  <circle cx="112" cy="990" r="6.5" fill="#6ca05f"/>
  <text x="132" y="998" class="text-tight">Java arbeitet mit Produkt-Objekten.</text>
  <circle cx="112" cy="1032" r="6.5" fill="#2b65b3"/>
  <text x="132" y="1040" class="text-tight">Die Datenbank speichert Zeilen und Spalten.</text>
  <circle cx="900" cy="990" r="6.5" fill="#c67f17"/>
  <text x="920" y="998" class="text-tight">DbProduktSpeicher übersetzt in beide Richtungen.</text>
  <circle cx="900" cy="1032" r="6.5" fill="#c67f17"/>
  <text x="920" y="1040" class="text-tight">Fachlogik bleibt frei von JDBC und SQL.</text>
</svg>
