<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Maven-Projekte: einfache Tests vorbereiten</title>
  <desc id="desc">Prozessgrafik: main trennt Ein- und Ausgabe von Fachlogik. Ein manueller Test vergleicht erwartetes und tatsächliches Resultat.</desc>
  <defs>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #555; }
      .section { font: 700 30px Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font: 700 26px Arial, Helvetica, sans-serif; fill: #111; }
      .text { font: 700 22px Arial, Helvetica, sans-serif; fill: #111; }
      .text-tight { font: 700 20px Arial, Helvetica, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #444; }
      .mono { font: 700 24px 'Courier New', Courier, monospace; fill: #111; }
      .green { fill: #4d8f3a; }
      .blue { fill: #2b65b3; }
      .orange { fill: #c67f17; }
      .grey { fill: #555; }
      .page { fill: #ffffff; }
      .panel { fill: #fbfcfd; stroke: #b9bcc3; stroke-width: 2.2; }
      .main-box { fill: #e8eef9; stroke: #2b65b3; stroke-width: 2.4; }
      .logic-box { fill: #e6efdf; stroke: #6ca05f; stroke-width: 2.4; }
      .test-box { fill: #fff7e8; stroke: #c67f17; stroke-width: 2.4; }
      .result-box { fill: #f3f5f7; stroke: #6b7078; stroke-width: 2.2; }
      .note-box { fill: #ffffff; stroke: #b9bcc3; stroke-width: 2; }
      .ok-box { fill: #edf6ea; stroke: #6ca05f; stroke-width: 2; }
      .fail-box { fill: #fff1e0; stroke: #c67f17; stroke-width: 2; }
      .flow { stroke: #2b65b3; stroke-width: 3.4; fill: none; }
      .return-flow { stroke: #6ca05f; stroke-width: 3.4; fill: none; }
      .test-flow { stroke: #c67f17; stroke-width: 3.4; fill: none; }
      .dash { stroke-dasharray: 10 8; }
    </style>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b65b3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ca05f"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c67f17"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" class="page"/>
  <text x="900" y="72" text-anchor="middle" class="title">Gut testbare Programme trennen Fachlogik von Ein-/Ausgabe</text>
  <text x="900" y="104" text-anchor="middle" class="subtitle">Maven-Projekte mit einfachen Tests vorbereiten · noch ohne JUnit und ohne externe Dependencies</text>

  <rect x="70" y="140" rx="22" ry="22" width="1660" height="500" class="panel"/>
  <text x="900" y="190" text-anchor="middle" class="section">Programmstruktur</text>

  <rect x="130" y="260" rx="18" ry="18" width="420" height="210" class="main-box"/>
  <text x="340" y="308" text-anchor="middle" class="heading blue">main</text>
  <text x="340" y="350" text-anchor="middle" class="text-tight">liest Eingaben</text>
  <text x="340" y="386" text-anchor="middle" class="text-tight">ruft Fachlogik auf</text>
  <text x="340" y="422" text-anchor="middle" class="text-tight">gibt Resultate aus</text>
  <text x="340" y="452" text-anchor="middle" class="small">Start und Anzeige, nicht Berechnung</text>

  <rect x="690" y="240" rx="18" ry="18" width="420" height="250" class="logic-box"/>
  <text x="900" y="288" text-anchor="middle" class="heading green">Fachlogik</text>
  <text x="900" y="330" text-anchor="middle" class="text-tight">erhält klare Eingaben</text>
  <text x="900" y="366" text-anchor="middle" class="text-tight">berechnet Resultat</text>
  <text x="900" y="402" text-anchor="middle" class="text-tight">gibt Wert zurück</text>
  <rect x="755" y="430" rx="10" ry="10" width="290" height="38" class="note-box"/>
  <text x="900" y="456" text-anchor="middle" class="mono">return wert;</text>

  <rect x="1250" y="260" rx="18" ry="18" width="420" height="210" class="result-box"/>
  <text x="1460" y="308" text-anchor="middle" class="heading grey">Resultat</text>
  <text x="1460" y="350" text-anchor="middle" class="text-tight">wird in main angezeigt</text>
  <text x="1460" y="386" text-anchor="middle" class="text-tight">oder im Test geprüft</text>
  <text x="1460" y="422" text-anchor="middle" class="text-tight">kein Rätselraten</text>
  <text x="1460" y="452" text-anchor="middle" class="small">ein Wert ist vergleichbar</text>

  <line x1="550" y1="350" x2="690" y2="350" class="flow" marker-end="url(#arrowBlue)"/>
  <text x="620" y="325" text-anchor="middle" class="small blue">Aufruf</text>
  <line x1="1110" y1="350" x2="1250" y2="350" class="return-flow" marker-end="url(#arrowGreen)"/>
  <text x="1180" y="325" text-anchor="middle" class="small green">Rückgabewert</text>

  <path d="M 900 490 C 900 565 1460 535 1460 470" class="return-flow dash" marker-end="url(#arrowGreen)"/>
  <text x="1180" y="552" text-anchor="middle" class="small green">derselbe Wert kann geprüft werden</text>

  <rect x="70" y="700" rx="22" ry="22" width="1660" height="330" class="panel"/>
  <text x="900" y="750" text-anchor="middle" class="section">Manueller Test</text>

  <rect x="130" y="810" rx="18" ry="18" width="360" height="130" class="test-box"/>
  <text x="310" y="852" text-anchor="middle" class="heading orange">Erwartet</text>
  <text x="310" y="892" text-anchor="middle" class="mono">9000</text>
  <text x="310" y="922" text-anchor="middle" class="small">vorher festlegen</text>

  <rect x="565" y="810" rx="18" ry="18" width="360" height="130" class="logic-box"/>
  <text x="745" y="852" text-anchor="middle" class="heading green">Tatsächlich</text>
  <text x="745" y="892" text-anchor="middle" class="mono">berechneRabattpreis()</text>
  <text x="745" y="922" text-anchor="middle" class="small">Rückgabewert nutzen</text>

  <rect x="1000" y="810" rx="18" ry="18" width="320" height="130" class="main-box"/>
  <text x="1160" y="852" text-anchor="middle" class="heading blue">Vergleich</text>
  <text x="1160" y="892" text-anchor="middle" class="mono">if / else</text>
  <text x="1160" y="922" text-anchor="middle" class="small">erwartet == tatsächlich</text>

  <rect x="1380" y="780" rx="16" ry="16" width="240" height="82" class="ok-box"/>
  <text x="1500" y="813" text-anchor="middle" class="heading green">OK</text>
  <text x="1500" y="842" text-anchor="middle" class="small">Vergleich stimmt</text>

  <rect x="1380" y="890" rx="16" ry="16" width="240" height="82" class="fail-box"/>
  <text x="1500" y="923" text-anchor="middle" class="heading orange">FEHLER</text>
  <text x="1500" y="952" text-anchor="middle" class="small">Werte unterscheiden</text>

  <line x1="490" y1="875" x2="565" y2="875" class="test-flow" marker-end="url(#arrowOrange)"/>
  <line x1="925" y1="875" x2="1000" y2="875" class="test-flow" marker-end="url(#arrowOrange)"/>
  <path d="M 1320 855 L 1380 825" class="test-flow" marker-end="url(#arrowOrange)"/>
  <path d="M 1320 895 L 1380 930" class="test-flow" marker-end="url(#arrowOrange)"/>

  <rect x="120" y="1048" rx="14" ry="14" width="1560" height="48" class="note-box"/>
  <text x="900" y="1080" text-anchor="middle" class="text">Merksatz: Ein Test vergleicht erwartetes Resultat mit tatsächlichem Resultat.</text>
</svg>
